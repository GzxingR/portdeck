<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PortDeck · 本机端口总控台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔌</text></svg>">
<style>
  :root{
    --bg:#0a0d12;
    --bg-grad-1:#0d1420;
    --bg-grad-2:#0a0d12;
    --panel:#11161f;
    --panel-hi:#161d29;
    --line:#1f2937;
    --line-hi:#2d3a4d;
    --fg:#e8eef7;
    --dim:#7d8b9e;
    --dim2:#5a6676;
    --accent:#4d9eff;
    --accent-dim:#1e3a5f;
    --ok:#3ddc84;
    --warn:#ffb020;
    --err:#ff5c5c;
    --purple:#a78bfa;
    --radius:12px;
    --mono:ui-monospace,"SF Mono",Consolas,"Cascadia Code",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(77,158,255,.13), transparent 60%),
      radial-gradient(900px 500px at 90% 0%, rgba(167,139,250,.09), transparent 55%),
      linear-gradient(180deg, var(--bg-grad-1), var(--bg-grad-2) 40%);
    background-attachment:fixed;
    color:var(--fg);
    font:14px/1.55 ui-sans-serif,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  /* ---------- 顶栏 ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(10,13,18,.82);
    backdrop-filter:blur(16px) saturate(1.4);
    border-bottom:1px solid var(--line);
  }
  .bar{
    display:flex;align-items:center;gap:18px;
    padding:14px 26px;flex-wrap:wrap;
    max-width:1640px;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:.3px}
  .brand .mark{
    width:26px;height:26px;border-radius:8px;
    background:linear-gradient(135deg,var(--accent),var(--purple));
    display:grid;place-items:center;font-size:14px;
    box-shadow:0 0 18px rgba(77,158,255,.4);
  }
  .brand b{color:var(--accent);font-weight:700}
  .host{font:11.5px/1 var(--mono);color:var(--dim2);padding:3px 8px;
    border:1px solid var(--line);border-radius:6px}

  .metrics{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .metric{
    background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:7px 14px;min-width:78px;
    transition:.18s;
  }
  .metric:hover{border-color:var(--line-hi);background:var(--panel-hi)}
  .metric .k{font-size:10.5px;color:var(--dim2);letter-spacing:.4px;text-transform:uppercase}
  .metric .v{font:600 19px/1.2 var(--mono);margin-top:2px}
  .metric.m-http .v{color:var(--ok)}
  .metric.m-known .v{color:var(--accent)}
  .metric.m-time .v{font-size:13px;color:var(--dim)}

  /* ---------- 工具行 ---------- */
  .tools{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:0 26px 14px;max-width:1640px;margin:0 auto;
  }
  .search{
    position:relative;flex:0 0 300px;
  }
  .search input{
    width:100%;background:var(--panel);border:1px solid var(--line);
    color:var(--fg);padding:9px 13px 9px 34px;border-radius:9px;
    outline:none;font-size:13px;transition:.18s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,158,255,.12)}
  .search input::placeholder{color:var(--dim2)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:15px;height:15px;stroke:var(--dim2);fill:none;stroke-width:2}

  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{
    background:var(--panel);border:1px solid var(--line);color:var(--dim);
    padding:6px 13px;border-radius:20px;cursor:pointer;font-size:12.5px;
    user-select:none;transition:.16s;white-space:nowrap;
  }
  .chip:hover{border-color:var(--line-hi);color:var(--fg);transform:translateY(-1px)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:650}
  .chip .n{opacity:.65;margin-left:4px;font-family:var(--mono);font-size:11.5px}

  .spacer{flex:1}
  .btn{
    background:var(--panel);border:1px solid var(--line);color:var(--fg);
    padding:8px 15px;border-radius:9px;font-size:12.5px;cursor:pointer;
    transition:.16s;display:inline-flex;align-items:center;gap:6px;
    text-decoration:none;white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:650}
  .btn.primary:hover{filter:brightness(1.12);color:#04121f}
  .btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2}
  .toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
  .btn.danger:hover{border-color:var(--err);color:var(--err)}
  .btn.ghost{background:transparent;border-style:dashed;color:var(--dim)}

  /* ---------- 弹窗 ---------- */
  .mask{
    position:fixed;inset:0;z-index:50;background:rgba(4,7,12,.74);
    backdrop-filter:blur(5px);display:grid;place-items:center;padding:18px;
  }
  .mask[hidden]{display:none}
  .modal{
    width:min(460px,100%);background:var(--panel);border:1px solid var(--line-hi);
    border-radius:16px;box-shadow:0 22px 70px rgba(0,0,0,.65);padding:20px 22px 18px;
    animation:rise .2s ease-out both;
  }
  .modal h2{font-size:16px;margin-bottom:4px}
  .modal .sub{font-size:12px;color:var(--dim2);margin-bottom:16px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
  .field input,.field select,.field textarea{
    width:100%;background:#0c1119;border:1px solid var(--line);border-radius:8px;
    color:var(--fg);padding:9px 11px;font:13px/1.5 inherit;outline:none;
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,158,255,.12);
  }
  .field textarea{resize:vertical;min-height:52px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .checkline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);margin:2px 0 14px}
  .checkline input{accent-color:var(--accent);width:15px;height:15px}
  .modal-actions{display:flex;gap:8px;align-items:center;margin-top:6px}
  .modal-actions .spacer{flex:1}
  .form-err{color:#ffb3b3;font-size:12.5px;min-height:18px;margin-bottom:4px}
  .card.offline{opacity:.68;border-style:dashed}
  .badge.off{color:var(--warn);border-color:rgba(255,176,32,.4)}

  /* ---------- 主体 ---------- */
  main{padding:20px 26px 70px;max-width:1640px;margin:0 auto}
  .grid{
    display:grid;gap:13px;
    grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  }

  .card{
    background:linear-gradient(180deg,var(--panel),#0e131b);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:15px 17px 14px;position:relative;overflow:hidden;
    transition:transform .18s cubic-bezier(.2,.8,.3,1),border-color .18s,box-shadow .18s;
    animation:rise .32s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card:hover{
    transform:translateY(-2px);
    border-color:var(--line-hi);
    box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 0 1px rgba(77,158,255,.12);
  }
  .card::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--dim2);transition:.18s;
  }
  .card:hover::before{width:4px}
  .card.c-模型::before{background:var(--purple)}
  .card.c-代理::before{background:var(--warn)}
  .card.c-工具::before{background:var(--accent)}
  .card.c-系统::before{background:#5a6676}
  .card.c-应用::before{background:var(--ok)}
  .card.c-其他::before{background:#39424f}

  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:7px}
  .port{
    font:700 21px/1 var(--mono);letter-spacing:-.5px;
    color:var(--fg);
  }
  .card.c-模型 .port{color:var(--purple)}
  .card.c-代理 .port{color:var(--warn)}
  .card.c-工具 .port{color:var(--accent)}
  .name{
    font-weight:620;font-size:13.5px;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .badge{
    font-size:10.5px;padding:2.5px 8px;border-radius:20px;
    background:var(--panel-hi);color:var(--dim);
    border:1px solid var(--line);white-space:nowrap;letter-spacing:.2px;
  }
  .note{
    color:var(--dim);font-size:12.5px;line-height:1.5;
    margin-bottom:11px;min-height:19px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .meta{
    display:flex;gap:11px;font:11.5px/1.4 var(--mono);color:var(--dim2);
    flex-wrap:wrap;align-items:center;
  }
  .meta .st{display:inline-flex;align-items:center;gap:5px;min-width:0}
  .meta .st span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
  .dot{width:6px;height:6px;border-radius:50%;background:#39424f;flex:0 0 auto}
  .dot.up{background:var(--ok);box-shadow:0 0 7px rgba(61,220,132,.7)}
  .dot.up.warn{background:var(--warn);box-shadow:0 0 7px rgba(255,176,32,.7)}

  .foot{display:flex;gap:7px;margin-top:12px;align-items:center}
  .foot .btn{padding:6px 12px;font-size:12px}

  .tag-auto{
    font-size:9.5px;padding:1.5px 6px;border-radius:5px;
    background:rgba(77,158,255,.12);color:var(--accent);
    border:1px solid rgba(77,158,255,.28);letter-spacing:.3px;
  }
  .tag-manual{
    font-size:9.5px;padding:1.5px 6px;border-radius:5px;
    background:rgba(61,220,132,.1);color:var(--ok);
    border:1px solid rgba(61,220,132,.25);letter-spacing:.3px;
  }

  .unknown{opacity:.55}
  .unknown:hover{opacity:.85}

  .empty{text-align:center;color:var(--dim2);padding:80px 0;font-size:14px}
  .err{
    background:rgba(255,92,92,.08);border:1px solid rgba(255,92,92,.35);
    color:#ffb3b3;padding:11px 15px;border-radius:10px;
    margin-bottom:16px;font-size:13px;
  }
  .skeleton{
    background:linear-gradient(90deg,var(--panel) 25%,var(--panel-hi) 50%,var(--panel) 75%);
    background-size:200% 100%;animation:shimmer 1.4s infinite;
    height:132px;border-radius:var(--radius);
  }
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#232c39;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#2f3a4a}

  @media (max-width:720px){
    .bar{padding:12px 16px}
    .tools{padding:0 16px 12px}
    main{padding:16px 16px 60px}
    .search{flex:1 1 100%}
    .metrics{width:100%;margin-left:0}
    .metric{flex:1;min-width:0}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <div class="mark">🔌</div>
      <div><span id="app-name">PortDeck</span></div>
    </div>
    <div class="host" id="host">—</div>
    <div class="metrics">
      <div class="metric"><div class="k">端口</div><div class="v" id="s-total">–</div></div>
      <div class="metric m-http"><div class="k">可访问</div><div class="v" id="s-http">–</div></div>
      <div class="metric m-known"><div class="k">已识别</div><div class="v" id="s-known">–</div></div>
      <div class="metric m-time"><div class="k">更新</div><div class="v" id="s-time">–</div></div>
    </div>
  </div>
  <div class="tools">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="搜索端口 / 名称 / 进程 / 说明…">
    </div>
    <div class="chips" id="cats"></div>
    <div class="spacer"></div>
    <label class="toggle"><input type="checkbox" id="auto"> 自动刷新</label>
    <button class="btn" id="rename">改名</button>
    <button class="btn primary" id="add">＋ 添加服务</button>
    <button class="btn" id="refresh">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      刷新
    </button>
  </div>
</header>

<main>
  <div id="err"></div>
  <div class="grid" id="grid">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</main>

<div class="mask" id="mask" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">添加服务</h2>
    <div class="sub" id="modal-sub"></div>
    <form id="form" novalidate>
      <div class="row2">
        <div class="field">
          <label for="f-port">端口 *</label>
          <input id="f-port" name="fPort" type="number" min="1" max="65535" required placeholder="例如 8080">
        </div>
        <div class="field">
          <label for="f-cat">分类</label>
          <select id="f-cat" name="fCat">
            <option>模型</option><option>代理</option><option selected>工具</option>
            <option>系统</option><option>应用</option><option>其他</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="f-name">服务名称 *</label>
        <input id="f-name" name="fName" maxlength="80" required placeholder="例如：我的调试接口">
      </div>
      <div class="field">
        <label for="f-note">用途说明</label>
        <textarea id="f-note" name="fNote" maxlength="300" placeholder="这个端口是干什么的"></textarea>
      </div>
      <div class="field" id="url-field">
        <label for="f-url">打开地址</label>
        <input id="f-url" name="fUrl" placeholder="http://127.0.0.1:8080/">
      </div>
      <label class="checkline" id="offline-line">
        <input type="checkbox" id="f-offline" name="fOffline"> 服务当前没运行时也显示在列表里
      </label>
      <div class="form-err" id="form-err"></div>
      <div class="modal-actions">
        <button type="button" class="btn danger" id="f-delete" hidden>删除此标注</button>
        <div class="spacer"></div>
        <button type="button" class="btn" id="f-cancel">取消</button>
        <button type="submit" class="btn primary" id="f-save">保存</button>
      </div>
    </form>
  </div>
</div>

<script>
let DATA = { ports: [], appName: 'PortDeck' };
let activeCat = '全部';
let q = '';
let timer = null;
let editingPort = null;   // null=添加；数字=编辑该端口的手动标注
let renameMode = false;

const CATS = ['全部','模型','代理','工具','系统','应用','其他'];

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function applyAppName(name){
  const n = String(name || 'PortDeck');
  document.getElementById('app-name').textContent = n;
  document.title = `${n} · 本机端口总控台`;
}

function renderChips(){
  const box = document.getElementById('cats');
  box.innerHTML = CATS.map(c => {
    const n = c === '全部' ? DATA.ports.length : DATA.ports.filter(p => p.cat === c).length;
    if (c !== '全部' && n === 0) return '';
    return `<div class="chip ${c===activeCat?'on':''}" data-cat="${c}">${c}<span class="n">${n}</span></div>`;
  }).join('');
  box.querySelectorAll('.chip').forEach(el => {
    el.onclick = () => { activeCat = el.dataset.cat; render(); };
  });
}

function statusOf(p){
  if (!p.http) return { cls: '', txt: '非 HTTP' };
  if (p.status >= 200 && p.status < 400) return { cls: 'up', txt: `HTTP ${p.status}` + (p.title ? ' · ' + p.title : '') };
  if (p.status >= 400) return { cls: 'up warn', txt: `HTTP ${p.status}` + (p.title ? ' · ' + p.title : '') };
  return { cls: 'up', txt: 'HTTP ' + p.status };
}

function render(){
  const g = document.getElementById('grid');
  let list = DATA.ports;
  if (activeCat !== '全部') list = list.filter(p => p.cat === activeCat);
  if (q) {
    const s = q.toLowerCase();
    list = list.filter(p =>
      String(p.port).includes(s) ||
      (p.name||'').toLowerCase().includes(s) ||
      (p.proc||'').toLowerCase().includes(s) ||
      (p.note||'').toLowerCase().includes(s) ||
      (p.cmd||'').toLowerCase().includes(s)
    );
  }

  document.getElementById('s-total').textContent = DATA.ports.length;
  document.getElementById('s-http').textContent = DATA.ports.filter(p => p.http).length;
  document.getElementById('s-known').textContent = DATA.ports.filter(p => p.known).length;
  document.getElementById('err').innerHTML = DATA.error
    ? `<div class="err">扫描出错：${esc(DATA.error)}</div>` : '';

  if (!list.length) {
    g.innerHTML = '<div class="empty">没有匹配的端口</div>';
    return;
  }

  g.innerHTML = list.map((p, i) => {
    const st = statusOf(p);
    const tag = p.src === 'manual'
      ? '<span class="tag-manual">已标注</span>'
      : (p.known ? '<span class="tag-auto">自动识别</span>' : '');
    const openBtn = p.url
      ? `<a class="btn primary" href="${esc(p.url)}" target="_blank" rel="noopener">打开</a>` : '';
    const manualBtn = `<button class="btn ghost" data-edit="${p.port}">${p.src === 'manual' ? '编辑' : '标注'}</button>`;
    const offlineBadge = p.offline ? '<span class="badge off">未运行</span>' : '';
    return `<div class="card c-${esc(p.cat)} ${p.known?'':'unknown'} ${p.offline?'offline':''}" style="animation-delay:${Math.min(i*12,240)}ms">
      <div class="card-head">
        <div class="port">${p.port}</div>
        <div class="name" title="${esc(p.name)}">${esc(p.name)}</div>
        ${offlineBadge}
        <div class="badge">${esc(p.cat)}</div>
      </div>
      <div class="note" title="${esc(p.note||'')}">${esc(p.note || '—')}</div>
      <div class="meta">
        <span class="st"><i class="dot ${st.cls}"></i><span>${esc(p.offline ? '未监听' : st.txt)}</span></span>
        ${p.offline ? '' : `<span>PID ${p.pid}</span>`}
        <span title="${esc(p.proc)}">${esc(p.proc || '')}</span>
      </div>
      <div class="foot">
        ${openBtn}
        <button class="btn" data-copy="${p.port}">复制地址</button>
        ${manualBtn}
        ${tag}
      </div>
    </div>`;
  }).join('');

  g.querySelectorAll('[data-copy]').forEach(b => {
    b.onclick = () => {
      const p = DATA.ports.find(x => String(x.port) === b.dataset.copy);
      const t = p.url || ('127.0.0.1:' + p.port);
      navigator.clipboard.writeText(t).then(() => {
        const old = b.textContent;
        b.textContent = '已复制';
        setTimeout(() => b.textContent = old, 1200);
      });
    };
  });
  g.querySelectorAll('[data-edit]').forEach(b => {
    b.onclick = () => openServiceModal(DATA.ports.find(x => String(x.port) === b.dataset.edit));
  });
}

/* ---------- 添加 / 编辑 / 改名 ---------- */

const mask = document.getElementById('mask');
const form = document.getElementById('form');
const formErr = document.getElementById('form-err');
const modalTitle = document.getElementById('modal-title');
const modalSub = document.getElementById('modal-sub');
const fDelete = document.getElementById('f-delete');

function showModal(){
  formErr.textContent = '';
  mask.hidden = false;
  setTimeout(() => document.getElementById(renameMode ? 'f-name' : 'f-port').focus(), 30);
}
function hideModal(){ mask.hidden = true; renameMode = false; editingPort = null; }

function setFieldVisibility(isRename){
  // 隐藏的 required 输入框仍然会参与表单校验，改名时必须一起禁用。
  for (const id of ['f-port','f-cat','f-note','f-url','f-offline']) {
    const el = document.getElementById(id);
    el.closest('.field, .checkline').hidden = isRename;
    el.disabled = isRename;
  }
  fDelete.hidden = isRename;
  document.getElementById('f-name').maxLength = isRename ? 40 : 80;
}

async function apiSend(method, url, body){
  const r = await fetch(url, {
    method, headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `请求失败 (${r.status})`);
  return j;
}

// renameMode=true 时表单复用「服务名称」输入框，改的是控制台自己的名字。
function openRenameModal(){
  renameMode = true;
  editingPort = null;
  setFieldVisibility(true);
  modalTitle.textContent = '更改控制台名称';
  modalSub.textContent = '名称保存在 ports.json，刷新页面后依然有效。';
  form.fName.value = DATA.appName || 'PortDeck';
  showModal();
}

function openServiceModal(p){
  renameMode = false;
  setFieldVisibility(false);
  if (p) {
    editingPort = p.port;
    modalTitle.textContent = `编辑 ${p.port} 的标注`;
    modalSub.textContent = p.src === 'manual'
      ? '修改后覆盖自动识别的名称和说明。'
      : '保存后会为这个端口创建手动标注，名称、分类、说明都由你决定。';
    form.fPort.value = p.port;
    form.fName.value = p.name;
    form.fCat.value = p.cat;
    form.fNote.value = p.note || '';
    form.fUrl.value = p.url || '';
    form.fOffline.checked = Boolean(p.showWhenOffline);
    fDelete.hidden = p.src !== 'manual';
  } else {
    editingPort = null;
    modalTitle.textContent = '添加服务';
    modalSub.textContent = '填写端口和名称；端口已在监听时会立刻出现在列表里。';
    form.reset();
    form.fCat.value = '工具';
    fDelete.hidden = true;
  }
  showModal();
}

form.onsubmit = async (e) => {
  e.preventDefault();
  formErr.textContent = '';
  const saveBtn = document.getElementById('f-save');
  saveBtn.disabled = true;
  try {
    if (renameMode) {
      await apiSend('PUT', '/api/settings', { appName: form.fName.value.trim() });
    } else {
      const body = {
        port: Number(form.fPort.value), name: form.fName.value.trim(),
        cat: form.fCat.value, note: form.fNote.value.trim(),
        url: form.fUrl.value.trim(), showWhenOffline: form.fOffline.checked,
      };
      if (editingPort === null) await apiSend('POST', '/api/services', body);
      else await apiSend('PUT', `/api/services/${editingPort}`, body);
    }
    hideModal();
    await load();
  } catch (err) {
    formErr.textContent = err.message;
  } finally {
    saveBtn.disabled = false;
  }
};

fDelete.onclick = async () => {
  if (editingPort === null || !confirm(`确定删除端口 ${editingPort} 的手动标注吗？`)) return;
  formErr.textContent = '';
  try {
    await apiSend('DELETE', `/api/services/${editingPort}`);
    hideModal();
    await load();
  } catch (err) { formErr.textContent = err.message; }
};

document.getElementById('f-cancel').onclick = hideModal;
mask.onclick = e => { if (e.target === mask) hideModal(); };
document.getElementById('add').onclick = () => openServiceModal(null);
document.getElementById('rename').onclick = openRenameModal;

async function load(){
  try {
    const r = await fetch('/api/ports', { cache: 'no-store' });
    DATA = await r.json();
    applyAppName(DATA.appName || window.PORTDECK_APP_NAME || 'PortDeck');
    document.getElementById('host').textContent = DATA.host || '—';
    document.getElementById('s-time').textContent =
      new Date(DATA.generatedAt).toLocaleTimeString('zh-CN', { hour12: false });
    renderChips();
    render();
  } catch (e) {
    document.getElementById('err').innerHTML = `<div class="err">请求失败：${esc(e.message)}</div>`;
  }
}

document.getElementById('q').oninput = e => { q = e.target.value.trim(); render(); };
document.getElementById('refresh').onclick = load;
document.getElementById('auto').onchange = e => {
  if (timer) { clearInterval(timer); timer = null; }
  if (e.target.checked) timer = setInterval(load, 10000);
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !mask.hidden) { hideModal(); return; }
  if (e.key === '/' && document.activeElement.id !== 'q' && mask.hidden) {
    e.preventDefault();
    document.getElementById('q').focus();
  }
});
applyAppName(window.PORTDECK_APP_NAME || 'PortDeck');
load();
</script>
</body>
